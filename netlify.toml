# ========================================================
# Netlify Configuration for JY Career Agent Dashboard
# ========================================================

[build]
  base = "frontend"
  publish = "dist/frontend/browser"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://jy-career-agent.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
